# Локальный PostgreSQL для проекта.
# Запуск:    docker compose up -d
# Остановка: docker compose down
# Удалить вместе с данными: docker compose down -v

services:
  postgres:
    image: postgres:16
    container_name: customer-analytics-db
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
